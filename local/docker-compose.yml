name: aws-api-template-local

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Local Cognito emulator. Trigger fidelity is partial (see docs/local-dev);
  # the local server falls back to a stub authorizer, so tests never depend on
  # emulator quirks.
  cognito-local:
    image: jagregory/cognito-local:latest
    ports:
      - "9229:9229"
    volumes:
      - ./cognito-local:/app/.cognito

  # No mock here: the contract package ships the spec, so a consumer mock is
  #   npx @stoplight/prism-cli mock "$(task -s contract:path)"
  # (or `task mock` in aws.contract.template).

volumes:
  pgdata:
