# Single source of truth for every command.
# Git hooks (lefthook) and GitHub Actions call ONLY `task <name>` — never inline
# shell — so local and CI run identical code paths. Tool versions come from mise.
#
# Commands are echoed (`task: [name] cmd`) so a log always shows which gate ran
# which tool. Every gate FAILS on findings; accepted findings live in
# .checkov.yaml / .trivyignore / `nosemgrep` comments with a written reason.
version: "3"

vars:
  TF_DIR: infra/terraform
  ENV: '{{.ENV | default "dev"}}'

env:
  APP_ENV: '{{.APP_ENV | default "local"}}'

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  # ---------------------------------------------------------------------------
  # Aggregate gates
  # ---------------------------------------------------------------------------
  check:
    desc: "Fast pre-commit gate: format, lint, typecheck, gen-drift, secrets, unit"
    cmds:
      - task: format:check
      - task: lint
      - task: typecheck
      - task: gen:check
      - task: security:secrets
      - task: test:unit

  ci:
    desc: "Full gate — runs IDENTICALLY locally and in GitHub Actions"
    cmds:
      - task: check
      - task: build
      - task: test:integration
      - task: test:bdd
      - task: test:contract
      - task: tf:validate
      - task: tf:scan
      - task: security:deps

  # ---------------------------------------------------------------------------
  # Code quality
  # ---------------------------------------------------------------------------
  format:
    desc: Auto-format all files
    cmds:
      - pnpm format
  format:check:
    desc: Check formatting
    cmds:
      - pnpm format:check
  lint:
    desc: Lint (eslint + security plugin)
    cmds:
      - pnpm lint
  typecheck:
    desc: TypeScript typecheck across the workspace
    cmds:
      - pnpm typecheck
  build:
    desc: Build all packages
    cmds:
      - pnpm build

  # ---------------------------------------------------------------------------
  # Contract (the installed @datagriff/todo-api-contract package) & codegen
  # ---------------------------------------------------------------------------
  contract:path:
    desc: Print the installed contract's absolute path (openapi.yaml)
    silent: true
    cmds:
      - node scripts/contract-path.mjs
  contract:dir:
    desc: Print the installed contract package's directory (collections/ lives under it)
    silent: true
    cmds:
      - node scripts/contract-path.mjs --dir
  contract:bump:
    desc: "Pin a new contract version, e.g. task contract:bump VERSION=1.2.0 (then task gen && task ci)"
    preconditions:
      - sh: test -n "{{.VERSION}}"
        msg: "Pass VERSION=<x.y.z> (a published @datagriff/todo-api-contract version)"
    cmds:
      # --save-exact: the contract is pinned to one version (the lockfile AND
      # package.json), so a bump is always an explicit, reviewed diff.
      - pnpm --filter @app/api add --save-exact @datagriff/todo-api-contract@{{.VERSION}}
  contract:link:
    desc: "Co-development: use a sibling checkout of aws.contract.template (built) instead of the registry. CONTRACT_DIR overrides ../aws.contract.template. Undo with task contract:unlink"
    vars:
      CONTRACT_DIR: '{{.CONTRACT_DIR | default "../aws.contract.template"}}'
    preconditions:
      - sh: test -f {{.CONTRACT_DIR}}/dist/index.js
        msg: "No built package at {{.CONTRACT_DIR}} — run `task build` there first."
    dir: packages/api
    cmds:
      # `pnpm link` is per package (no --filter) and leaves package.json alone, but
      # it records a machine-specific `link:` path in the lockfile — restore it so
      # the link can never be committed.
      - pnpm link "$(cd ../.. && realpath {{.CONTRACT_DIR}})"
      - git -C ../.. checkout -- pnpm-lock.yaml
  contract:unlink:
    desc: Back to the registry version of the contract package
    dir: packages/api
    cmds:
      - pnpm unlink @datagriff/todo-api-contract
      - pnpm install
  gen:
    desc: "Regenerate everything derived from the contract here: the API Gateway spec (AWS extensions)"
    cmds:
      - task: gen:gateway
  gen:gateway:
    desc: Render the API Gateway spec (AWS extensions) from the installed contract
    cmds:
      - node scripts/render-gateway-spec.mjs
  gen:check:
    desc: Fail if generated artifacts are stale (contract drift gate)
    vars:
      # Every path `task gen` writes. `git status --porcelain` (not `git diff`)
      # so brand-new untracked files count as drift too.
      GEN_PATHS: infra/terraform/modules/api-gateway/openapi.gateway.yaml
    cmds:
      - task: gen
      - |
        drift="$(git status --porcelain -- {{.GEN_PATHS}})"
        if [ -n "$drift" ]; then
          echo "Generated artifacts are stale. Run 'task gen' and commit:"
          echo "$drift"
          exit 1
        fi
  http:
    desc: "Send one of the contract's .http collections locally, e.g. task http FILE=todos (stub token minted on the fly)"
    vars:
      FILE: '{{.FILE | default "todos"}}'
    cmds:
      - httpyac send "$(node scripts/contract-path.mjs --dir)/collections/{{.FILE}}.http" --all --env local --var token="$(node scripts/mint-token.mjs --print)" --var apiKey=local-dev-key

  # ---------------------------------------------------------------------------
  # Tests (layers kept distinct — see docs/testing)
  # ---------------------------------------------------------------------------
  test:
    desc: Run unit + integration + BDD + contract
    cmds:
      - task: test:unit
      - task: test:integration
      - task: test:bdd
      - task: test:contract
  test:unit:
    desc: Unit tests (pure logic, no I/O) — every workspace package that defines test:unit
    cmds:
      - pnpm -r --if-present test:unit
  test:integration:
    desc: Integration tests (real Postgres via testcontainers + migrations)
    cmds:
      - pnpm --filter @app/api test:integration
  test:bdd:
    desc: "BDD / behavioural (cucumber-js) — executable acceptance criteria"
    cmds:
      - pnpm --filter @app/api test:bdd
  test:contract:
    desc: "Contract tests over real HTTP against local/server.ts + throwaway Postgres (Docker): Schemathesis provider conformance, published-client consumer conformance, .http collection replay — all from the pinned @datagriff/todo-api-contract"
    cmds:
      # Orchestrated by packages/api/test/contract/run.ts: container, migrations,
      # server on a free loopback port, stub token, schemathesis, client, httpyac, teardown.
      - pnpm --filter @app/api test:contract
  test:fuzz:
    desc: "Property-based fuzzing (Schemathesis) against a DEPLOYED stage — nightly / on-spec-change"
    cmds:
      - ./scripts/schemathesis.sh

  # ---------------------------------------------------------------------------
  # Local dev
  # ---------------------------------------------------------------------------
  up:
    desc: Start the local stack (Postgres, cognito-local)
    cmds:
      - docker compose -f local/docker-compose.yml up -d --wait
      - task: db:migrate
  down:
    desc: Stop the local stack
    cmds:
      - docker compose -f local/docker-compose.yml down -v
  serve:
    desc: Run the Lambda handler behind a local HTTP server
    cmds:
      - pnpm --filter @app/api serve
  token:
    desc: "Mint an unsigned local stub JWT into the git-ignored .http private env (local only)"
    cmds:
      - node scripts/mint-token.mjs {{.CLI_ARGS}}

  # ---------------------------------------------------------------------------
  # Database
  # ---------------------------------------------------------------------------
  db:migrate:
    desc: Apply database migrations (env-aware)
    cmds:
      - pnpm --filter @app/api db:migrate
  db:query:
    desc: "Run a named example query via psql, e.g. task db:query -- todos_by_tenant"
    cmds:
      - ./scripts/db-query.sh {{.CLI_ARGS}}
  db:console:
    desc: Open Harlequin against the selected env for interactive SQL
    cmds:
      - ./scripts/db-console.sh

  # ---------------------------------------------------------------------------
  # Security scanning
  # ---------------------------------------------------------------------------
  security:
    desc: Run all security scans
    cmds:
      - task: security:secrets
      - task: security:deps
      - task: security:code
      - task: tf:scan
      - task: sbom
  security:secrets:
    desc: Secret scanning (gitleaks)
    cmds:
      - gitleaks detect --no-banner --redact
  security:deps:
    desc: Dependency & filesystem vulnerability scan (trivy)
    cmds:
      # Vulnerabilities come from committed lockfiles; skip vendored/build dirs
      # so we don't scan dependency-shipped Dockerfiles or .terraform providers.
      - trivy fs --scanners vuln,misconfig --exit-code 1 --severity HIGH,CRITICAL --skip-dirs "**/node_modules" --skip-dirs "**/.terraform" --skip-dirs "**/dist" .
  security:code:
    desc: "Static analysis (semgrep) — fails on findings; suppress with a nosemgrep comment + reason"
    cmds:
      # `--error` exits non-zero on findings. Paths excluded in .semgrepignore.
      - mkdir -p test-results
      - semgrep --config auto --error --metrics=on --text --json-output=test-results/semgrep.json
  sbom:
    desc: Generate a CycloneDX SBOM
    cmds:
      - trivy fs --format cyclonedx --output sbom.cdx.json .

  # ---------------------------------------------------------------------------
  # Terraform
  # ---------------------------------------------------------------------------
  tf:fmt:
    desc: Format Terraform
    cmds:
      - terraform -chdir={{.TF_DIR}}/envs/{{.ENV}} fmt -recursive ../../
  tf:validate:
    desc: Terraform fmt-check + validate (every env) + tflint (recursive)
    cmds:
      - terraform -chdir={{.TF_DIR}} fmt -check -recursive
      - for: { var: TF_ROOTS }
        cmd: terraform -chdir={{.TF_DIR}}/{{.ITEM}} init -backend=false -input=false >/dev/null && terraform -chdir={{.TF_DIR}}/{{.ITEM}} validate
      # --recursive: infra/terraform itself holds no .tf files, only modules/, stack/, envs/.
      - tflint --chdir={{.TF_DIR}} --init
      - tflint --chdir={{.TF_DIR}} --recursive
      - task: tf:test
    vars:
      TF_ROOTS: envs/dev envs/staging envs/prod
  tf:test:
    desc: "terraform test of the stack's guardrails, sizing rules and platform-interface consumption (mocked providers, no credentials)"
    cmds:
      - terraform -chdir={{.TF_DIR}}/stack init -backend=false -input=false >/dev/null
      - terraform -chdir={{.TF_DIR}}/stack test
  tf:scan:
    desc: IaC security scan (Trivy config + Checkov) — both fail on findings
    cmds:
      # Trivy (which absorbed tfsec) gates on serious misconfigurations; accepted
      # exceptions are documented in .trivyignore.
      - trivy config --exit-code 1 --severity HIGH,CRITICAL {{.TF_DIR}}
      # Checkov policy + justified skips live in .checkov.yaml. In GitHub Actions
      # the failed checks are also rendered as a Markdown table in the job summary.
      - mkdir -p test-results
      - checkov -d {{.TF_DIR}} --config-file .checkov.yaml -o cli -o github_failed_only --output-file-path console,test-results/checkov-failed.md
  tf:plan:
    desc: "Terraform plan for an env, e.g. task tf:plan ENV=dev (backend names derived from service_name+env+account; needs AWS creds)"
    dir: "{{.TF_DIR}}/envs/{{.ENV}}"
    cmds:
      # Backend names are derived from the env's service_name (read from
      # terraform.tfvars, or SERVICE_NAME override) + env + account id — exactly
      # the names the platform bootstrap created when this service was
      # registered (aws.infra.template) — so nothing account-specific is
      # committed and there are no state secrets to set.
      # The state key's alias is resolved to its ARN: the platform's bucket policy
      # only accepts writes encrypted with exactly that key.
      - |
        set -euo pipefail
        svc="${SERVICE_NAME:-$(sed -nE 's/^service_name[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' terraform.tfvars)}"
        account="$(aws sts get-caller-identity --query Account --output text)"
        region="${AWS_REGION:-eu-west-2}"
        key_arn="$(aws kms describe-key --key-id "alias/${svc}-tfstate-{{.ENV}}" --query KeyMetadata.Arn --output text)"
        terraform init -input=false -reconfigure \
          -backend-config=bucket="${svc}-tfstate-{{.ENV}}-${account}" \
          -backend-config=region="${region}" \
          -backend-config=dynamodb_table="${svc}-tflock-{{.ENV}}" \
          -backend-config=kms_key_id="${key_arn}"
      - terraform plan -input=false -var-file=terraform.tfvars -out=tfplan
  tf:apply:
    desc: "Terraform apply for an env (used by CI deploy). Applies the saved plan from tf:plan."
    dir: "{{.TF_DIR}}/envs/{{.ENV}}"
    cmds:
      - task: tf:plan
        vars: { ENV: "{{.ENV}}" }
      - terraform apply -input=false tfplan

  deploy:
    desc: "Full deploy for an env: apply infra, then run migrations (migrations must be backward-compatible with the version that was live; see docs/operations)"
    cmds:
      - task: tf:apply
        vars: { ENV: "{{.ENV}}" }
      - task: db:migrate

  smoke:
    desc: "Post-deploy smoke: health + API Gateway behaviour checks (authorizer, gateway responses, CORS) against URL=<invoke url> for ENV=<env>"
    dir: "{{.TF_DIR}}/envs/{{.ENV}}"
    preconditions:
      - sh: test -n "{{.URL}}"
        msg: "Pass URL=<stage invoke url> (terraform output api_invoke_url)."
    cmds:
      # The stage's API key value is only readable through the API (the output exposes the id).
      - |
        API_KEY="$(aws apigateway get-api-key --api-key "$(terraform output -raw api_key_id)" --include-value --query value --output text)"
        httpyac send "$(node ../../../../scripts/contract-path.mjs --dir)/collections/health.http" ../../../../collections/gateway.http --all --var baseUrl={{.URL}} --var apiKey="$API_KEY"

  # ---------------------------------------------------------------------------
  # Release
  # ---------------------------------------------------------------------------
  release:
    desc: Run semantic-release (changelog, tag, GitHub release) — pinned via the root devDependencies/lockfile
    cmds:
      - pnpm exec semantic-release -e ./.releaserc.json

  # ---------------------------------------------------------------------------
  # Cost
  # ---------------------------------------------------------------------------
  cost:
    desc: "Infracost breakdown for an env (JSON to OUT=<file> when set, e.g. for the PR comment)"
    dir: "{{.TF_DIR}}/envs/{{.ENV}}"
    cmds:
      - infracost breakdown --path . {{if .OUT}}--format json --out-file {{.OUT}}{{end}}

  hooks:install:
    desc: Install the git hooks (also runs automatically on `pnpm install`)
    cmds:
      - lefthook install
