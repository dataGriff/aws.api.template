name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # gitleaks (task security:secrets) scans history, same as the local hook
          persist-credentials: false

      # Installs every tool pinned in .mise.toml, so CI uses the SAME versions
      # as local dev and the git hooks.
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
        with:
          install: true
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The one gate. Identical to running `task ci` on a laptop:
      # format, lint, typecheck, spec lint, gen-drift, secrets, unit,
      # build, integration (testcontainers), BDD, contract, terraform validate
      # (all envs + bootstrap, tflint recursive), terraform scan, dependency scan.
      - name: task ci
        run: task ci
