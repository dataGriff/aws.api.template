name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: read # install @datagriff/todo-api-contract

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0 # gitleaks (task security:secrets) scans history, same as the local hook
          persist-credentials: false

      # Installs every tool pinned in .mise.toml, so CI uses the SAME versions
      # as local dev and the git hooks.
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with:
          install: true
          cache: true

      # The contract package lives on GitHub Packages. A package published from
      # another repo is readable by this repo's GITHUB_TOKEN only once the
      # package grants it access (aws.contract.template docs/operations);
      # PACKAGES_READ_TOKEN (a PAT with read:packages) is the fallback.
      - name: Configure registry auth
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN || secrets.GITHUB_TOKEN }}
        run: echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> "$HOME/.npmrc"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The gates below are exactly the sub-tasks of `task ci` (what the pre-push
      # hook runs), one step each so the Actions UI shows which gate failed and
      # its log is collapsible on its own. Every gate fails on findings.
      - name: "check: format, lint, typecheck, gen drift, secrets, unit"
        run: task check
      - name: "build: Lambda bundle"
        run: task build
      - name: "test: integration (real Postgres via testcontainers)"
        run: task test:integration
      - name: "test: BDD acceptance scenarios"
        run: task test:bdd
      - name: "test: contract over HTTP (Schemathesis provider + published client + .http collection)"
        run: task test:contract
      - name: "terraform: fmt, validate (all envs), tflint, terraform test (guardrails + platform interface)"
        run: task tf:validate
      - name: "terraform: security scan (trivy + checkov)"
        run: task tf:scan
      - name: "dependencies: vulnerability scan (trivy)"
        run: task security:deps

      - name: Upload test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: test-results
          path: |
            test-results/
            packages/api/test-results/
          if-no-files-found: ignore
          retention-days: 14
