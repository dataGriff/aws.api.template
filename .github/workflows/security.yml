name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1" # weekly

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0 # gitleaks needs history
          persist-credentials: false

      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with:
          install: true
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Secret scan (gitleaks)
        run: task security:secrets

      - name: IaC scan (trivy config + checkov)
        run: task tf:scan

      - name: Static analysis (semgrep)
        run: task security:code

      - name: Dependency & filesystem scan (trivy)
        run: task security:deps

      - name: Generate SBOM (CycloneDX)
        run: task sbom

      - name: Upload SBOM and scanner reports
        if: ${{ always() }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: security-reports
          path: |
            sbom.cdx.json
            test-results/
          if-no-files-found: ignore
