name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # tags, releases, changelog commit
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: { fetch-depth: 0 }
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with: { install: true, cache: true }
      - run: pnpm install --frozen-lockfile
      # NOTE: @semantic-release/git pushes a changelog commit to main. If main is
      # branch-protected, allow the GITHUB_TOKEN (or a deploy key/app token) to
      # bypass the rule, or drop the git plugin from .releaserc.json.
      # semantic-release commits the changelog (and regenerated files) itself;
      # the repo's pre-commit hook (task check) must not run inside that commit —
      # its drift gate would see the release's own staged changes as stale.
      - name: Semantic release
        env:
          LEFTHOOK: "0"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: task release
