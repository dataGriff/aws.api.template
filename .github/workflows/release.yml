name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write # tags, releases, changelog commit
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: jdx/mise-action@v2
        with: { install: true, cache: true }
      - run: pnpm install --frozen-lockfile
      - name: Semantic release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: task release

  # Publish the generated consumer SDK when enabled and a registry token is set.
  # Set packages/sdk publishConfig.registry and the package scope to your org
  # first (see docs/consumer-guide). Version is taken from the tag semantic-release
  # just created.
  publish-sdk:
    needs: release
    if: ${{ vars.PUBLISH_SDK == 'true' }}
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: jdx/mise-action@v2
        with: { install: true, cache: true }
      - run: pnpm install --frozen-lockfile
      - name: Publish SDK
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION="$(git describe --tags --abbrev=0 | sed 's/^v//')"
          task sdk:publish VERSION="$VERSION"

  docs:
    needs: release
    runs-on: ubuntu-latest
    permissions: { contents: read, pages: write, id-token: write }
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with: { install: true, cache: true }
      - run: pnpm install --frozen-lockfile
      - name: Build API reference
        run: task docs:api
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: docs/api-reference }
      - id: deploy
        uses: actions/deploy-pages@v4
