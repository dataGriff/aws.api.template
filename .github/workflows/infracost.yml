name: Infracost

on:
  pull_request:
    paths:
      - "infra/terraform/**"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: infracost-${{ github.ref }}
  cancel-in-progress: true

jobs:
  infracost:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # Infracost needs an API key. Skip cleanly (green) when it isn't configured
      # so the template doesn't fail CI out of the box.
      - name: Check for API key
        id: guard
        env:
          INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
        run: |
          if [ -z "$INFRACOST_API_KEY" ]; then
            echo "::warning::INFRACOST_API_KEY not set — skipping cost estimate."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.guard.outputs.enabled == 'true'
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with: { install: true, cache: true }

      - if: steps.guard.outputs.enabled == 'true'
        uses: infracost/actions/setup@e9d6e6cd65e168e76b0de50ff9957d2fe8bb1832 # v3.0.1
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      # Same task a developer runs locally (`task cost ENV=dev`).
      - name: Cost breakdown (dev env)
        if: steps.guard.outputs.enabled == 'true'
        run: task cost ENV=dev OUT=/tmp/infracost.json

      - name: Post PR comment
        if: steps.guard.outputs.enabled == 'true'
        run: |
          infracost comment github --path /tmp/infracost.json \
            --repo "$GITHUB_REPOSITORY" \
            --pull-request "${{ github.event.pull_request.number }}" \
            --github-token "${{ secrets.GITHUB_TOKEN }}" \
            --behavior update
