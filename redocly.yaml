extends:
  - recommended

apis:
  todo@v1:
    root: api/openapi.yaml

rules:
  # Baseline hygiene
  operation-operationId: error
  operation-operationId-unique: error
  operation-2xx-response: error
  no-unresolved-refs: error
  no-unused-components: warn
  # Intentional for a template: example.com is a documented placeholder server,
  # and the health probe deliberately has no 4xx.
  no-server-example.com: off
  operation-4xx-response: off

  # --- Naming standard: lower_snake_case for the data contract -------------
  # Schema property names must be snake_case.
  rule/schema-properties-snake-case:
    subject:
      type: SchemaProperties
    assertions:
      casing: snake_case
    severity: error
    message: "Schema property names must be lower_snake_case."

  # Enum values must be snake_case.
  rule/enum-values-snake-case:
    subject:
      type: Schema
      property: enum
    assertions:
      casing: snake_case
    severity: error
    message: "Enum values must be lower_snake_case."

  # NOTE on parameters: query/path params are authored in snake_case by
  # convention; HTTP header params stay kebab-case (e.g. idempotency-key,
  # x-api-key), so we intentionally do not blanket-enforce Parameter casing.

decorators:
  # Strip AWS gateway extensions from published/reference output if ever added.
  remove-x-internal:
    internalFlagProperty: x-internal
